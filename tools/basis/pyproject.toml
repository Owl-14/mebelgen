[project]
name = "basis"
version = "1.0.0"
description = "Akeda Studio: мебельное ТЗ → ParamSpec → детерминированный генератор → производственная модель БАЗИС"
requires-python = ">=3.10"
dependencies = [
  "argon2-cffi>=23.1.0",
  "openai>=1.40.0",
  "pydantic>=2.7.0,<3",
  "python-dotenv>=1.0.0",
  "jsonschema>=4.22.0",
  "requests>=2.31.0",
  "opentelemetry-sdk>=1.27.0,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.27.0,<2",
  "langgraph>=1.2,<1.3",
  "langgraph-checkpoint-sqlite>=3.1,<3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "hypothesis>=6.112,<7"]

[tool.pytest.ini_options]
testpaths = ["tests"]

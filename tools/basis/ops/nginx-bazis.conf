# nginx-прокси демо (/etc/nginx/sites-available/bazis).
# HTTPS-блок дописывает certbot (--nginx -d studio.akeda.ru --redirect) — здесь
# базовая версия ДО certbot; после выпуска сертификата файл на сервере длиннее.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name studio.akeda.ru akeda.studio www.akeda.studio _;
    client_max_body_size 25m;
    include /etc/nginx/snippets/akeda-admin-locations.conf;
    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;          # rate-limit чата по IP (AKD-271)
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}

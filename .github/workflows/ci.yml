name: basis-ci
on:
  push:
    branches: [master]
    paths: ["tools/basis/**", ".github/workflows/ci.yml"]
  # The `test` job is a required master check. It must exist for every PR,
  # including documentation-only and workflow/governance changes.
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/basis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/basis/requirements*.txt
      - name: deps
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: engine check matrix
        run: python -m qa.engine_checks
      - name: offline HTTP rollback drill
        run: python -m qa.rollout_drill --output out/rollout-drill.json
      - name: unit tests
        run: python -m pytest tests/ -q
      - name: regression gate (goldens)
        run: python -m tests.regression

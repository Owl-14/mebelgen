name: basis-ci
on:
  push:
    branches: [master]
    paths: ["tools/basis/**", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["tools/basis/**", ".github/workflows/ci.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/basis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/basis/requirements*.txt
      - name: deps
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: unit tests
        run: python -m pytest tests/ -q
      - name: regression gate (goldens)
        run: python -m tests.regression
